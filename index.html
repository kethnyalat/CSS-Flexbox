<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title> Flex Containers</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 20px;
      padding: 20px;
    }

    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f4f4f4;
    }

    h2 {
      margin: 20px 0 10px;
    }

    .box {
      background: #4a90d9;
      color: white;
      padding: 20px;
      border-radius: 6px;
      text-align: center;
      flex-wrap: wrap;
      min-height: 400px;
      min-width: 300px;
    }

    .container-1 {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      background: #ddd;
      padding: 10px;
      align-items: center;
      border-radius: 2px;

    }.container-1 img {
  width: 200px;
  height: 200px;
  object-fit: cover;
  border-radius: 10%;
  border: 2px solid white;
}


  </style>
</head>
<body>

  <h2>Keprisuf Group</h2>
  <div class="container-1">
    <div class="box">KETH MONICA DIING
        <img src="profile pic.jpeg" alt="Headshot of Keth">
        <a href="https://kethnyalat.github.io/Portfolio/" target="_blank" rel="noopener"></a>
    </div>
    <div class="box">NYANGOMA PRISCIRAH
        <img src="WhatsApp Image 2026-09-28 at 09.42.05.jpeg" alt="Headshot of Priscirah">
      <a href="https://priscirah.github.io/My-Motivation/" target="_blank" rel="noopener"></a>
      
      </a>
    </div>
    <div class="box">MWEBAZA YUSUF
        <img src="WhatsApp Image 2026-09-28 at 09.41.52 - Copy.jpeg" alt="Headshot of yusuf">
      <a href="https://kememy.github.io/mid-semester/" target="_blank" rel="noopener"></a>
      </a>
    </div>
  </div>
</body>
</html>
